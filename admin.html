<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Gangsal Baraya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-6">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-gray-800">🛠️ Dashboard Admin</h1>
            <button onclick="saveAll()" class="bg-orange-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-700 transition">Simpan Semua Perubahan</button>
        </div>

        <div class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-orange-600 border-l-4 border-orange-600 pl-3">Identitas & Hero</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Nama Perusahaan</label>
                    <input type="text" id="company-name" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Judul Utama (Hero)</label>
                    <input type="text" id="hero-title" class="w-full border p-2 rounded">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold mb-1">Sub-judul Hero</label>
                    <textarea id="hero-subtitle" class="w-full border p-2 rounded" rows="2"></textarea>
                </div>
            </div>
        </div>

        <div class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-orange-600 border-l-4 border-orange-600 pl-3">Informasi Kontak</h2>
            <div class="grid md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold mb-1">Alamat (Sesuai Company Profile)</label>
                    <input type="text" id="address" placeholder="jln. tukad punggawa no. 30 densel" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">WhatsApp (Format: 628...)</label>
                    <input type="text" id="whatsapp" placeholder="6285797426504" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Email</label>
                    <input type="email" id="email" placeholder="gangsalbaraya@gmail.com" class="w-full border p-2 rounded">
                </div>
            </div>
        </div>

        <div class="mb-10">
            <h2 class="text-xl font-bold mb-4 text-orange-600 border-l-4 border-orange-600 pl-3">Tim Inti </h2>
            <div id="team-list" class="space-y-4">
                </div>
        </div>
    </div>

    <script>
        // KREDENSIAL SUPABASE
        const SUPABASE_URL = 'https://wqxfqdyxcpabkkywmvgm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A7zVqD3u_EejyieqlHk0qw_rCNnycg5';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Memuat data saat halaman dibuka
        async function loadData() {
            let { data: settings } = await supabase.from('settings').select('*').single();
            
            if (settings) {
                document.getElementById('company-name').value = settings.company_name || 'CV. GANGSAL BARAYA KONSTRUKSI';
                document.getElementById('hero-title').value = settings.hero_title || 'Membangun Masa Depan Bali';
                document.getElementById('hero-subtitle').value = settings.hero_subtitle || 'Kontraktor terpercaya untuk proyek konstruksi';
                document.getElementById('address').value = settings.address || 'jln. tukad punggawa no. 30 densel - denpasar';
                document.getElementById('whatsapp').value = settings.whatsapp || '6285797426504';
                document.getElementById('email').value = settings.email || 'gangsalbaraya@gmail.com';
            }
            
            loadTeam();
        }

        async function loadTeam() {
            let { data: team } = await supabase.from('team').select('*');
            const container = document.getElementById('team-list');
            
            if (team) {
                container.innerHTML = team.map(member => `
                    <div class="flex gap-4 p-3 bg-gray-50 rounded border">
                        <div class="flex-1">
                            <input type="text" value="${member.name}" class="w-full font-bold border-none bg-transparent">
                            <input type="text" value="${member.position}" class="w-full text-sm text-gray-500 border-none bg-transparent">
                        </div>
                    </div>
                `).join('');
            }
        }

        async function saveAll() {
            const updates = {
                company_name: document.getElementById('company-name').value,
                hero_title: document.getElementById('hero-title').value,
                hero_subtitle: document.getElementById('hero-subtitle').value,
                address: document.getElementById('address').value,
                whatsapp: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value
            };

            const { error } = await supabase.from('settings').update(updates).eq('id', 1);

            if (error) {
                alert("Gagal menyimpan: " + error.message);
            } else {
                alert("✅ Data Berhasil Diperbarui! Cek website publik kamu sekarang.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
